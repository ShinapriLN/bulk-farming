pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        maven {
            name = 'KikuGie Releases'
            url = 'https://maven.kikugie.dev/releases'
        }

        maven {
            name = 'KikuGie Snapshots'
            url = 'https://maven.kikugie.dev/snapshots'
        }
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
}

stonecutter {
    create(rootProject) {
        versions(
                '1.21',
                '1.21.1',
                '1.21.2',
                '1.21.3',
                '1.21.4',
                '1.21.5',
                '1.21.6',
                '1.21.7',
                '1.21.8',
                '1.21.9',
                '1.21.10',
                '1.21.11'
        )

        vcsVersion = '1.21.6'
    }
}

rootProject.name = 'bulk-farming'